[pytest]
testpaths = tests
# Show full diffs on assertion failures
addopts = -v --tb=short
# Treat warnings as errors to keep the codebase clean
filterwarnings =
    error
    # Reticulum and LXMF emit deprecation warnings we don't control
    ignore::DeprecationWarning:RNS
    ignore::DeprecationWarning:LXMF
    ignore::DeprecationWarning:lxmf
    ignore::ResourceWarning
    # Starlette's TestClient prefers httpx2 and warns when it falls back to
    # httpx; it still works, and pinning a new transport dependency just to
    # silence a warning is the worse trade.
    ignore::starlette.exceptions.StarletteDeprecationWarning