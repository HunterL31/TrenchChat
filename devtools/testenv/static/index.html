<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrenchChat test environment</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --panel2: #313338; --border: #3f4147;
    --text: #dbdee1; --dim: #949ba4; --accent: #5865f2; --accent2: #4752c4;
    --danger: #da373c; --ok: #23a55a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--dim); min-width: 0; }
  #reset-btn {
    background: var(--danger); color: white; border: none; border-radius: 4px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  #reset-btn:hover { background: #c62d31; }
  #reset-btn:disabled { opacity: 0.5; cursor: default; }
  main { flex: 1; display: flex; overflow: hidden; }
  .pane {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    border-right: 1px solid var(--border);
  }
  .pane:last-child { border-right: none; }
  .pane-header {
    padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .pane-name { font-weight: 700; font-size: 14px; }
  .pane-hash { font-size: 11px; color: var(--dim); font-family: monospace; }
  .invite-bar {
    display: none; align-items: center; justify-content: space-between;
    background: #3a3f2a; border-bottom: 1px solid var(--border);
    padding: 8px 14px; font-size: 12px;
  }
  .invite-bar.show { display: flex; }
  .invite-bar button {
    border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px;
    cursor: pointer; margin-left: 6px; color: white;
  }
  .invite-bar .accept { background: var(--ok); }
  .invite-bar .decline { background: var(--danger); }
  .pane-body { flex: 1; display: flex; overflow: hidden; }
  .channel-list {
    width: 200px; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px; flex-shrink: 0;
  }
  .channel-item {
    padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
    color: var(--dim); margin-bottom: 2px;
  }
  .channel-item:hover { background: var(--panel2); }
  .channel-item.active { background: var(--accent); color: white; }
  .channel-item .badge {
    font-size: 10px; opacity: 0.7; display: block;
  }
  .new-channel-btn {
    width: 100%; margin-top: 6px; padding: 6px; background: var(--panel2);
    color: var(--text); border: 1px dashed var(--border); border-radius: 4px;
    cursor: pointer; font-size: 12px;
  }
  .new-channel-btn:hover { border-color: var(--accent); }
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-toolbar {
    padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px;
    color: var(--dim); display: flex; justify-content: space-between; align-items: center;
  }
  .chat-toolbar button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-left: 6px;
  }
  .chat-toolbar button:hover { border-color: var(--accent); }
  .messages { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 13px; }
  .msg { margin-bottom: 8px; }
  .msg .sender { font-weight: 700; margin-right: 6px; }
  .msg .content { color: var(--text); }
  .msg .self .sender { color: #ffa057; }
  .empty-state { color: var(--dim); font-size: 12px; padding: 20px; text-align: center; }
  .compose { display: flex; padding: 10px; border-top: 1px solid var(--border); gap: 8px; }
  .compose input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
  .compose button {
    background: var(--accent); color: white; border: none; border-radius: 4px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .compose button:hover { background: var(--accent2); }
  .attach-btn {
    background: var(--panel2) !important; border: 1px solid var(--border);
    padding: 8px 10px !important; flex-shrink: 0;
  }
  .image-preview {
    display: none; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--panel2);
  }
  .image-preview.show { display: flex; }
  .image-preview img { max-height: 60px; border-radius: 4px; margin: 6px 0; }
  .image-preview .remove-img {
    background: var(--danger); color: white; border: none; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .msg img.attached { max-width: 260px; max-height: 260px; border-radius: 6px; display: block; margin-top: 4px; }
  .msg .reply-quote {
    border-left: 2px solid var(--accent); padding: 2px 8px; margin-bottom: 3px;
    font-size: 11px; color: var(--dim); opacity: 0.85;
  }
  .msg .reply-quote b { color: var(--text); }
  .msg .reply-btn {
    background: none; border: none; color: var(--dim); font-size: 10px;
    cursor: pointer; opacity: 0; margin-left: 6px; padding: 0;
  }
  .msg:hover .reply-btn { opacity: 1; }
  .msg .reply-btn:hover { color: var(--accent); text-decoration: underline; }
  .reply-bar {
    display: none; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: var(--panel2); border-left: 2px solid var(--accent);
    font-size: 11px; color: var(--dim);
  }
  .reply-bar.show { display: flex; }
  .reply-bar b { color: var(--text); }
  .reply-bar button {
    background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px;
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); margin-right: 6px;
  }
  .status-dot.up { background: var(--ok); }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 18px; font-size: 13px; display: none; z-index: 10;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; width: min(320px, 90vw);
  }
  .modal h3 { margin: 0 0 12px 0; font-size: 14px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 7px 9px; font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    padding: 7px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;
  }
  .modal-actions .cancel { background: var(--panel); color: var(--text); }
  .modal-actions .confirm { background: var(--accent); color: white; }
  .member-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 12px; gap: 8px;
  }
  .member-row:last-child { border-bottom: none; }
  .member-hash { font-family: monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .member-role {
    font-size: 10px; text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    background: var(--panel); color: var(--dim); flex-shrink: 0;
  }
  .member-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .member-actions button {
    border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px;
    cursor: pointer; color: white; white-space: nowrap;
  }
  .member-actions .kick { background: var(--danger); }
  .member-actions .promote, .member-actions .demote { background: var(--accent); }
  .perm-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .perm-table th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 4px; font-size: 11px; }
  .perm-table th:not(:first-child), .perm-table td:not(:first-child) { text-align: center; width: 60px; }
  .perm-table td { padding: 6px 4px; border-top: 1px solid var(--border); }
  .perm-table input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }

  /* --- Mobile: stack the two tester panes instead of squeezing them
     side by side into unusable slivers. --- */
  @media (max-width: 860px) {
    header {
      flex-wrap: wrap;
    }
    header h1 { font-size: 13px; }
    #hint { display: none; }
    main {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .pane {
      border-right: none;
      border-bottom: 2px solid var(--border);
      flex: none;
      height: 48vh;
      min-height: 320px;
    }
    .pane:last-child { border-bottom: none; }
    .channel-list {
      width: 120px;
    }
    .chat-toolbar {
      flex-wrap: wrap;
      row-gap: 4px;
    }
  }

  /* --- Very narrow phones: channel list gets tight, drop it further
     and shrink the compose button so the input stays usable. --- */
  @media (max-width: 420px) {
    .channel-list { width: 96px; padding: 6px; }
    .channel-item { font-size: 12px; padding: 6px; }
    .compose button { padding: 8px 10px; }
    .pane-hash { font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>TrenchChat test environment &mdash; <span id="hint">two isolated testers, real backend, no manual key exchange</span></h1>
  <button id="reset-btn" onclick="resetEnvironment()">Reset environment</button>
</header>

<main id="panes"></main>

<div id="toast"></div>

<div class="modal-backdrop" id="new-channel-modal">
  <div class="modal">
    <h3>New channel</h3>
    <label>Name</label>
    <input id="nc-name" placeholder="general">
    <label>Access</label>
    <select id="nc-access">
      <option value="public">Public (open join)</option>
      <option value="invite">Invite-only</option>
    </select>
    <div class="modal-actions">
      <button class="cancel" onclick="closeNewChannelModal()">Cancel</button>
      <button class="confirm" onclick="submitNewChannel()">Create</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="members-modal">
  <div class="modal" style="width: min(420px, 90vw);">
    <h3>Members</h3>
    <div id="members-list"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeMembersModal()">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="permissions-modal">
  <div class="modal" style="width: min(420px, 90vw);">
    <h3>Role permissions</h3>
    <div id="permissions-editor"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closePermissionsModal()">Cancel</button>
      <button class="confirm" onclick="savePermissions()">Save</button>
    </div>
  </div>
</div>

<script>
const TESTERS = ['A', 'B'];
const state = {
  A: { port: null, me: null, channels: [], activeChannel: null, ws: null, invites: [], pendingImage: null, replyTarget: null },
  B: { port: null, me: null, channels: [], activeChannel: null, ws: null, invites: [], pendingImage: null, replyTarget: null },
};
let newChannelForTag = null;

function apiBase(tag) {
  return `http://${location.hostname}:${state[tag].port}`;
}
function wsBase(tag) {
  return `ws://${location.hostname}:${state[tag].port}`;
}
function other(tag) { return tag === 'A' ? 'B' : 'A'; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 3000);
}

async function api(tag, path, opts) {
  const res = await fetch(apiBase(tag) + path, opts);
  if (!res.ok) throw new Error(`${tag} ${path} -> ${res.status}`);
  return res.json();
}

function renderShell() {
  const panes = document.getElementById('panes');
  panes.innerHTML = TESTERS.map(tag => `
    <div class="pane" id="pane-${tag}">
      <div class="pane-header">
        <div class="pane-name"><span class="status-dot" id="dot-${tag}"></span>Tester ${tag}</div>
        <div class="pane-hash" id="hash-${tag}">connecting...</div>
      </div>
      <div class="invite-bar" id="invite-bar-${tag}">
        <span id="invite-text-${tag}"></span>
        <span>
          <button class="accept" onclick="respondInvite('${tag}', true)">Accept</button>
          <button class="decline" onclick="respondInvite('${tag}', false)">Decline</button>
        </span>
      </div>
      <div class="pane-body">
        <div class="channel-list">
          <div id="channels-${tag}"></div>
          <button class="new-channel-btn" onclick="openNewChannelModal('${tag}')">+ New channel</button>
        </div>
        <div class="chat-area">
          <div class="chat-toolbar">
            <span id="active-channel-${tag}">No channel selected</span>
            <span>
              <button onclick="openMembersModal('${tag}')" title="View and manage members">Members</button>
              <button onclick="openPermissionsModal('${tag}')" title="Edit role permissions">Permissions</button>
              <button onclick="inviteOther('${tag}')" title="Invite the other tester to this channel">Invite ${other(tag)}</button>
            </span>
          </div>
          <div class="messages" id="messages-${tag}">
            <div class="empty-state">Select or create a channel to get started.</div>
          </div>
          <div class="reply-bar" id="reply-bar-${tag}"></div>
          <div class="image-preview" id="image-preview-${tag}"></div>
          <div class="compose">
            <input type="file" accept="image/*" id="file-input-${tag}" style="display:none"
                  onchange="onImageSelected('${tag}', this.files[0])">
            <button class="attach-btn" onclick="document.getElementById('file-input-${tag}').click()"
                   title="Attach an image">📎</button>
            <input id="compose-${tag}" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage('${tag}')">
            <button onclick="sendMessage('${tag}')">Send</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

async function connectTester(tag) {
  const cfg = await (await fetch('/config')).json();
  state[tag].port = tag === 'A' ? cfg.a_api_port : cfg.b_api_port;

  for (let i = 0; i < 20; i++) {
    try {
      state[tag].me = await api(tag, '/me');
      break;
    } catch (e) {
      await new Promise(r => setTimeout(r, 500));
    }
  }
  if (!state[tag].me) {
    document.getElementById(`hash-${tag}`).textContent = 'failed to connect';
    return;
  }
  document.getElementById(`dot-${tag}`).classList.add('up');
  document.getElementById(`hash-${tag}`).textContent = state[tag].me.hash_hex.slice(0, 16) + '…';

  await refreshChannels(tag);
  await refreshInvites(tag);
  connectWs(tag);
}

function connectWs(tag) {
  const ws = new WebSocket(wsBase(tag) + '/ws');
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'message' && msg.channel_hash === state[tag].activeChannel) {
      renderMessages(tag);
    } else if (msg.type === 'invite_received') {
      toast(`Tester ${tag}: invite received for #${msg.channel_name}`);
      refreshInvites(tag);
    } else if (msg.type === 'channel_joined' || msg.type === 'member_list_updated') {
      refreshChannels(tag);
      if (msg.channel_hash === state[tag].activeChannel) {
        renderMessages(tag);
        if (membersModalTag === tag) refreshMembersModal();
      }
    }
  };
  ws.onclose = () => setTimeout(() => connectWs(tag), 2000);
  state[tag].ws = ws;
}

async function refreshInvites(tag) {
  state[tag].invites = await api(tag, '/invites');
  const bar = document.getElementById(`invite-bar-${tag}`);
  const text = document.getElementById(`invite-text-${tag}`);
  if (state[tag].invites.length === 0) {
    bar.classList.remove('show');
    return;
  }
  const inv = state[tag].invites[0];
  const more = state[tag].invites.length > 1 ? ` (+${state[tag].invites.length - 1} more)` : '';
  text.textContent = `Invited to #${inv.channel_name}${more}`;
  bar.classList.add('show');
  bar.dataset.channelHash = inv.channel_hash_hex;
}

async function respondInvite(tag, accept) {
  const bar = document.getElementById(`invite-bar-${tag}`);
  const channelHash = bar.dataset.channelHash;
  if (!channelHash) return;
  await api(tag, `/invites/${channelHash}/${accept ? 'accept' : 'decline'}`, {method: 'POST'});
  await refreshInvites(tag);
  if (accept) toast(`Tester ${tag}: join request sent, waiting for admin approval`);
}

async function refreshChannels(tag) {
  state[tag].channels = await api(tag, '/channels');
  const list = document.getElementById(`channels-${tag}`);
  if (state[tag].channels.length === 0) {
    list.innerHTML = '<div class="empty-state">No channels yet</div>';
    return;
  }
  list.innerHTML = state[tag].channels.map(c => `
    <div class="channel-item ${c.hash === state[tag].activeChannel ? 'active' : ''}"
        onclick="selectChannel('${tag}', '${c.hash}')">
      #${c.name}
      <span class="badge">${c.open_join ? 'public' : 'invite-only'}</span>
    </div>
  `).join('');
}

async function selectChannel(tag, hash) {
  state[tag].activeChannel = hash;
  clearReplyTarget(tag);
  clearPendingImage(tag);
  await refreshChannels(tag);
  const ch = state[tag].channels.find(c => c.hash === hash);
  document.getElementById(`active-channel-${tag}`).textContent = ch ? `#${ch.name}` : hash;
  await renderMessages(tag);
}

async function renderMessages(tag) {
  if (!state[tag].activeChannel) return;
  const msgs = await api(tag, `/channels/${state[tag].activeChannel}/messages`);
  const box = document.getElementById(`messages-${tag}`);
  if (msgs.length === 0) {
    box.innerHTML = '<div class="empty-state">No messages yet</div>';
    return;
  }
  const myHash = state[tag].me.hash_hex;
  const byId = Object.fromEntries(msgs.map(m => [m.message_id, m]));
  box.innerHTML = msgs.map(m => {
    const quoted = m.reply_to && byId[m.reply_to];
    const quoteHtml = quoted ? `
      <div class="reply-quote">
        <b>${escapeHtml(quoted.sender_name || quoted.sender_hash.slice(0, 8))}</b>
        ${escapeHtml((quoted.content || '(image)').slice(0, 60))}
      </div>` : '';
    return `
    <div class="msg ${m.sender_hash === myHash ? 'self' : ''}">
      ${quoteHtml}
      <span class="sender">${escapeHtml(m.sender_name || m.sender_hash.slice(0, 8))}</span>
      <span class="content">${escapeHtml(m.content)}</span>
      <button class="reply-btn" onclick='setReplyTarget("${tag}", ${JSON.stringify(m.message_id)}, ${JSON.stringify(m.sender_name || m.sender_hash.slice(0, 8))}, ${JSON.stringify(m.content || "(image)")})'>reply</button>
      ${m.has_image ? `<img class="attached" src="${apiBase(tag)}/channels/${state[tag].activeChannel}/messages/${m.message_id}/image">` : ''}
    </div>
  `;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function setReplyTarget(tag, messageId, senderName, content) {
  state[tag].replyTarget = messageId;
  const bar = document.getElementById(`reply-bar-${tag}`);
  bar.innerHTML = `
    <span>Replying to <b>${escapeHtml(senderName)}</b>: ${escapeHtml(content.slice(0, 60))}</span>
    <button onclick="clearReplyTarget('${tag}')">&times;</button>
  `;
  bar.classList.add('show');
  document.getElementById(`compose-${tag}`).focus();
}

function clearReplyTarget(tag) {
  state[tag].replyTarget = null;
  const bar = document.getElementById(`reply-bar-${tag}`);
  bar.classList.remove('show');
  bar.innerHTML = '';
}

function onImageSelected(tag, file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    // reader.result is "data:image/png;base64,AAAA..." -- keep just the b64 part.
    state[tag].pendingImage = reader.result.split(',')[1];
    const preview = document.getElementById(`image-preview-${tag}`);
    preview.innerHTML = `
      <img src="${reader.result}">
      <button class="remove-img" onclick="clearPendingImage('${tag}')">Remove</button>
    `;
    preview.classList.add('show');
  };
  reader.readAsDataURL(file);
}

function clearPendingImage(tag) {
  state[tag].pendingImage = null;
  document.getElementById(`file-input-${tag}`).value = '';
  const preview = document.getElementById(`image-preview-${tag}`);
  preview.classList.remove('show');
  preview.innerHTML = '';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function sendMessage(tag) {
  const input = document.getElementById(`compose-${tag}`);
  const content = input.value.trim();
  const image = state[tag].pendingImage;
  const replyTo = state[tag].replyTarget;
  if ((!content && !image) || !state[tag].activeChannel) return;
  input.value = '';
  clearPendingImage(tag);
  clearReplyTarget(tag);
  const result = await api(tag, `/channels/${state[tag].activeChannel}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content, image_data_b64: image, reply_to: replyTo}),
  });
  if (!result.ok) toast(`Tester ${tag}: message not sent (permission?)`);
  await renderMessages(tag);
}

async function inviteOther(tag) {
  if (!state[tag].activeChannel) { toast('Select a channel first'); return; }
  const target = other(tag);
  if (!state[target].me) { toast(`Tester ${target} not connected yet`); return; }
  await api(tag, `/channels/${state[tag].activeChannel}/invite`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({peer_hash_hex: state[target].me.hash_hex}),
  });
  toast(`Invite sent to Tester ${target}`);
}

function openNewChannelModal(tag) {
  newChannelForTag = tag;
  document.getElementById('nc-name').value = '';
  document.getElementById('new-channel-modal').classList.add('show');
}
function closeNewChannelModal() {
  document.getElementById('new-channel-modal').classList.remove('show');
}
async function submitNewChannel() {
  const name = document.getElementById('nc-name').value.trim();
  const access = document.getElementById('nc-access').value;
  if (!name || !newChannelForTag) return;
  const tag = newChannelForTag;
  closeNewChannelModal();
  const result = await api(tag, '/channels', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, access}),
  });
  await refreshChannels(tag);
  await selectChannel(tag, result.hash);
}

let membersModalTag = null;

async function openMembersModal(tag) {
  if (!state[tag].activeChannel) { toast('Select a channel first'); return; }
  membersModalTag = tag;
  document.getElementById('members-modal').classList.add('show');
  await refreshMembersModal();
}

function closeMembersModal() {
  membersModalTag = null;
  document.getElementById('members-modal').classList.remove('show');
}

async function refreshMembersModal() {
  const tag = membersModalTag;
  if (!tag || !state[tag].activeChannel) return;
  const ch = state[tag].activeChannel;
  const [members, perms] = await Promise.all([
    api(tag, `/channels/${ch}/members`),
    api(tag, `/channels/${ch}/my_permissions`),
  ]);
  const myHash = state[tag].me.hash_hex;
  const list = document.getElementById('members-list');
  list.innerHTML = members.map(m => {
    const isSelf = m.identity_hash === myHash;
    const actions = [];
    if (!isSelf && m.role !== 'owner') {
      if (perms.kick) {
        actions.push(`<button class="kick" onclick="kickMember('${m.identity_hash}')">Kick</button>`);
      }
      if (perms.manage_roles) {
        if (m.role === 'admin') {
          actions.push(`<button class="demote" onclick="demoteMember('${m.identity_hash}')">Demote</button>`);
        } else {
          actions.push(`<button class="promote" onclick="promoteMember('${m.identity_hash}')">Promote</button>`);
        }
      }
    }
    return `
      <div class="member-row">
        <span class="member-hash">${m.identity_hash.slice(0, 20)}…${isSelf ? ' (you)' : ''}</span>
        <span class="member-role">${m.role}</span>
        <span class="member-actions">${actions.join('')}</span>
      </div>
    `;
  }).join('') || '<div class="empty-state">No members</div>';
}

async function kickMember(memberHash) {
  const tag = membersModalTag;
  await api(tag, `/channels/${state[tag].activeChannel}/roles`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({remove_members: [memberHash]}),
  });
  await refreshMembersModal();
}

async function promoteMember(memberHash) {
  const tag = membersModalTag;
  await api(tag, `/channels/${state[tag].activeChannel}/roles`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({add_admins: [memberHash]}),
  });
  await refreshMembersModal();
}

async function demoteMember(memberHash) {
  const tag = membersModalTag;
  await api(tag, `/channels/${state[tag].activeChannel}/roles`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({remove_admins: [memberHash]}),
  });
  await refreshMembersModal();
}

let permissionsModalTag = null;

async function openPermissionsModal(tag) {
  if (!state[tag].activeChannel) { toast('Select a channel first'); return; }
  permissionsModalTag = tag;
  const ch = state[tag].activeChannel;
  const perms = await api(tag, `/channels/${ch}/permissions`);
  const editor = document.getElementById('permissions-editor');
  editor.innerHTML = `
    <table class="perm-table">
      <tr><th>Permission</th><th>Admin</th><th>Member</th></tr>
      ${perms.all_permissions.map(p => `
        <tr>
          <td>${p}</td>
          <td><input type="checkbox" data-role="admin" data-perm="${p}" ${perms.admin.includes(p) ? 'checked' : ''}></td>
          <td><input type="checkbox" data-role="member" data-perm="${p}" ${perms.member.includes(p) ? 'checked' : ''}></td>
        </tr>
      `).join('')}
    </table>
    <div class="empty-state" style="padding: 8px 0 0;">Owner always has every permission.</div>
  `;
  document.getElementById('permissions-modal').classList.add('show');
}

function closePermissionsModal() {
  permissionsModalTag = null;
  document.getElementById('permissions-modal').classList.remove('show');
}

async function savePermissions() {
  const tag = permissionsModalTag;
  if (!tag) return;
  const boxes = document.querySelectorAll('#permissions-editor input[type=checkbox]');
  const admin = [], member = [];
  boxes.forEach(b => {
    if (b.checked) (b.dataset.role === 'admin' ? admin : member).push(b.dataset.perm);
  });
  const result = await api(tag, `/channels/${state[tag].activeChannel}/permissions`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({admin, member}),
  });
  if (!result.ok) toast(`Tester ${tag}: permission change denied (missing manage_channel?)`);
  closePermissionsModal();
}

async function resetEnvironment() {
  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';
  closeMembersModal();
  closePermissionsModal();
  TESTERS.forEach(tag => {
    if (state[tag].ws) state[tag].ws.close();
    state[tag] = { port: null, me: null, channels: [], activeChannel: null, ws: null, invites: [], pendingImage: null, replyTarget: null };
  });
  renderShell();
  try {
    const res = await fetch('/reset', {method: 'POST'});
    const body = await res.json();
    if (!body.ok) toast('Reset had trouble bringing both testers back up');
  } catch (e) {
    toast('Reset request failed: ' + e);
  }
  await Promise.all(TESTERS.map(connectTester));
  btn.disabled = false;
  btn.textContent = 'Reset environment';
}

renderShell();
TESTERS.forEach(connectTester);
</script>
</body>
</html>
