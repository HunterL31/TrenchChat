<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrenchChat test environment</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --panel2: #313338; --border: #3f4147;
    --text: #dbdee1; --dim: #949ba4; --accent: #5865f2; --accent2: #4752c4;
    --danger: #da373c; --ok: #23a55a; --warn: #f0b232;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--dim); min-width: 0; }
  #reset-btn {
    background: var(--danger); color: white; border: none; border-radius: 4px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  #reset-btn:hover { background: #c62d31; }
  #reset-btn:disabled { opacity: 0.5; cursor: default; }
  main {
    flex: 1; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0,1fr));
    grid-auto-rows: minmax(320px, 1fr); overflow-y: auto; overflow-x: hidden;
  }
  .pane {
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .pane.offline .pane-header { background: #3a2626; }
  .pane.offline { opacity: 0.75; }
  .pane-header {
    padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .pane-name { font-weight: 700; font-size: 14px; }
  .pane-hash { font-size: 11px; color: var(--dim); font-family: monospace; }
  .pane-controls { margin-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .link-btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 9px; font-size: 11px; cursor: pointer;
  }
  .link-btn:hover { border-color: var(--accent); }
  .tone-btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 9px; font-size: 11px; cursor: pointer;
  }
  .tone-btn:hover { border-color: var(--accent); }
  .tone-btn.on { border-color: var(--accent); color: var(--accent); }
  .link-profile {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 4px; font-size: 11px; cursor: pointer; max-width: 150px;
  }
  .link-profile.shaped { border-color: var(--warn); color: var(--warn); }
  .restart-hint {
    display: none; font-size: 10px; color: var(--dim); cursor: help;
  }
  .restart-hint.show { display: inline; }
  .proc-btn {
    border: none; border-radius: 4px; padding: 3px 9px; font-size: 11px; cursor: pointer;
    color: white; font-weight: 700;
  }
  .proc-btn.kill { background: var(--danger); }
  .proc-btn.kill:hover { background: #c62d31; }
  .proc-btn.start { background: var(--ok); }
  .link-down-badge {
    display: none; background: var(--danger); color: white; font-size: 10px;
    font-weight: 700; letter-spacing: 0.03em; border-radius: 4px; padding: 2px 7px;
  }
  .pane.offline .link-down-badge { display: inline-block; }
  .peer-strip { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
  .peer-chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .avatar-thumb {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    background-color: var(--panel); background-size: cover; background-position: center;
    vertical-align: middle; margin-right: 6px; border: 1px solid var(--border); cursor: pointer;
  }
  .avatar-thumb-sm {
    display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    background-color: var(--panel); background-size: cover; background-position: center;
    vertical-align: middle; margin-right: 4px; border: 1px solid var(--border);
  }
  .editable-name { cursor: pointer; border-bottom: 1px dashed transparent; }
  .editable-name:hover { border-bottom-color: var(--dim); }
  .name-edit-input {
    background: var(--bg); border: 1px solid var(--accent); border-radius: 3px;
    color: var(--text); font-size: 14px; font-weight: 700; padding: 1px 4px; width: 140px;
  }
  .invite-bar {
    display: none; align-items: center; justify-content: space-between;
    background: #3a3f2a; border-bottom: 1px solid var(--border);
    padding: 8px 14px; font-size: 12px;
  }
  .invite-bar.show { display: flex; }
  .invite-bar button {
    border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px;
    cursor: pointer; margin-left: 6px; color: white;
  }
  .invite-bar .accept { background: var(--ok); }
  .invite-bar .decline { background: var(--danger); }
  .pane-body { flex: 1; display: flex; overflow: hidden; }
  .channel-list {
    width: 200px; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px; flex-shrink: 0;
  }
  .channel-item {
    padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
    color: var(--dim); margin-bottom: 2px;
  }
  .channel-item:hover { background: var(--panel2); }
  .channel-item.active { background: var(--accent); color: white; }
  .channel-item .badge {
    font-size: 10px; opacity: 0.7; display: block;
  }
  .server-item {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
    color: var(--text); font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; display: flex; justify-content: space-between;
    align-items: center; margin-top: 6px;
  }
  .server-item:hover { background: var(--panel2); }
  .srv-add {
    font-size: 15px; line-height: 1; padding: 0 4px; opacity: 0.6;
  }
  .srv-add:hover { opacity: 1; }
  .srv-caret {
    display: inline-block; width: 10px; font-size: 9px; opacity: 0.7;
  }
  .srv-count {
    font-size: 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 6px; margin-right: 4px; opacity: 0.8;
  }
  .new-channel-btn {
    width: 100%; margin-top: 6px; padding: 6px; background: var(--panel2);
    color: var(--text); border: 1px dashed var(--border); border-radius: 4px;
    cursor: pointer; font-size: 12px;
  }
  .new-channel-btn:hover { border-color: var(--accent); }
  .discovered-header {
    font-size: 10px; text-transform: uppercase; color: var(--dim);
    margin: 14px 0 6px 4px; letter-spacing: 0.03em;
  }
  .discovered-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-radius: 4px; font-size: 12px; color: var(--dim);
    margin-bottom: 2px;
  }
  .discovered-item button {
    background: var(--ok); color: white; border: none; border-radius: 4px;
    padding: 3px 9px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-toolbar {
    padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px;
    color: var(--dim); display: flex; justify-content: space-between; align-items: center;
  }
  .chat-toolbar button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-left: 6px;
  }
  .chat-toolbar button:hover { border-color: var(--accent); }
  .sync-status { font-size: 11px; margin-left: 8px; }
  .sync-status.syncing { color: #e8c33a; }
  .sync-status.synced { color: #3ddc3d; }
  .sync-status.incomplete { color: #e8963a; }
  .sync-status.waiting { color: var(--dim); }
  .sync-status.unknown { color: var(--dim); }
  .messages { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 13px; }
  .msg { margin-bottom: 8px; }
  .msg .sender { font-weight: 700; margin-right: 6px; }
  .msg .content { color: var(--text); }
  .inline-emoji { height: 18px; width: 18px; object-fit: contain; vertical-align: middle; }
  .msg .self .sender { color: #ffa057; }
  .msg-row { display: flex; align-items: flex-start; gap: 2px; }
  .msg-body { flex: 1; min-width: 0; }
  .react-btn {
    background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px;
    padding: 0 4px; opacity: 0; visibility: hidden;
  }
  .msg:hover .react-btn { opacity: 1; visibility: visible; }
  .reactions { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px; }
  .reaction-chip {
    display: inline-flex; align-items: center; gap: 4px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px 1px 4px;
    cursor: pointer; font-size: 11px;
  }
  .reaction-chip.mine { border-color: var(--accent); background: #333a6b; }
  .reaction-chip img { width: 14px; height: 14px; object-fit: contain; }
  .emoji-picker {
    position: absolute; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; z-index: 30; display: flex; flex-wrap: wrap;
    gap: 6px; width: 180px;
  }
  .emoji-picker img { width: 24px; height: 24px; object-fit: contain; cursor: pointer; }
  .emoji-picker .empty-state { padding: 4px; width: 100%; }
  .emoji-picker .import-row { width: 100%; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .emoji-picker .import-row label {
    font-size: 11px; color: var(--dim); cursor: pointer; text-decoration: underline;
  }
  .empty-state { color: var(--dim); font-size: 12px; padding: 20px; text-align: center; }
  .compose { display: flex; padding: 10px; border-top: 1px solid var(--border); gap: 8px; }
  .compose input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 8px 10px; font-size: 13px;
  }
  .compose button {
    background: var(--accent); color: white; border: none; border-radius: 4px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .compose button:hover { background: var(--accent2); }
  .attach-btn {
    background: var(--panel2) !important; border: 1px solid var(--border);
    padding: 8px 10px !important; flex-shrink: 0;
  }
  .image-preview {
    display: none; align-items: center; gap: 8px; padding: 0 10px;
    background: var(--panel2);
  }
  .image-preview.show { display: flex; }
  .image-preview img { max-height: 60px; border-radius: 4px; margin: 6px 0; }
  .image-preview .remove-img {
    background: var(--danger); color: white; border: none; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .msg img.attached { max-width: 260px; max-height: 260px; border-radius: 6px; display: block; margin-top: 4px; }
  .msg .reply-quote {
    border-left: 2px solid var(--accent); padding: 2px 8px; margin-bottom: 3px;
    font-size: 11px; color: var(--dim); opacity: 0.85;
  }
  .msg .reply-quote b { color: var(--text); }
  .msg .reply-btn {
    background: none; border: none; color: var(--dim); font-size: 10px;
    cursor: pointer; opacity: 0; margin-left: 6px; padding: 0;
  }
  .msg:hover .reply-btn { opacity: 1; }
  .msg .reply-btn:hover { color: var(--accent); text-decoration: underline; }
  .reply-bar {
    display: none; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: var(--panel2); border-left: 2px solid var(--accent);
    font-size: 11px; color: var(--dim);
  }
  .reply-bar.show { display: flex; }
  .reply-bar b { color: var(--text); }
  .reply-bar button {
    background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px;
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); margin-right: 6px;
  }
  .status-dot.up { background: var(--ok); }
  .status-dot.stopped { background: var(--danger); }
  .status-dot.down { background: var(--warn); }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 18px; font-size: 13px; display: none; z-index: 10;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; width: min(320px, 90vw);
  }
  .modal h3 { margin: 0 0 12px 0; font-size: 14px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 7px 9px; font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    padding: 7px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;
  }
  .modal-actions .cancel { background: var(--panel); color: var(--text); }
  .modal-actions .confirm { background: var(--accent); color: white; }
  .member-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 12px; gap: 8px;
  }
  .member-row:last-child { border-bottom: none; }
  .member-hash { font-family: monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .member-role {
    font-size: 10px; text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
    background: var(--panel); color: var(--dim); flex-shrink: 0;
  }
  .member-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .member-actions button {
    border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px;
    cursor: pointer; color: white; white-space: nowrap;
  }
  .member-actions .kick { background: var(--danger); }
  .member-actions .promote, .member-actions .demote { background: var(--accent); }
  .perm-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .perm-table th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 4px; font-size: 11px; }
  .perm-table th:not(:first-child), .perm-table td:not(:first-child) { text-align: center; width: 60px; }
  .perm-table td { padding: 6px 4px; border-top: 1px solid var(--border); }
  .perm-table input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
  .directory-results { max-height: 220px; overflow-y: auto; margin-top: 6px; }
  .directory-item {
    display: flex; align-items: center; gap: 6px; padding: 7px 6px; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  .directory-item:hover { background: var(--panel); }
  .dir-hash { color: var(--dim); font-size: 11px; font-family: monospace; margin-left: auto; }

  /* --- Mobile: stack panes one per row instead of squeezing them into
     unusable slivers. --- */
  @media (max-width: 860px) {
    header {
      flex-wrap: wrap;
    }
    header h1 { font-size: 13px; }
    #hint { display: none; }
    main { --cols: 1 !important; }
    .channel-list {
      width: 120px;
    }
    .chat-toolbar {
      flex-wrap: wrap;
      row-gap: 4px;
    }
  }

  /* --- Very narrow phones: channel list gets tight, drop it further
     and shrink the compose button so the input stays usable. --- */
  @media (max-width: 420px) {
    .channel-list { width: 96px; padding: 6px; }
    .channel-item { font-size: 12px; padding: 6px; }
    .compose button { padding: 8px 10px; }
    .pane-hash { font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>TrenchChat test environment &mdash; <span id="hint">N isolated testers, real backends, no manual key exchange</span></h1>
  <button id="reset-btn" onclick="resetEnvironment()">Reset environment</button>
</header>

<main id="panes"></main>

<div id="toast"></div>

<div class="modal-backdrop" id="custom-link-modal">
  <div class="modal">
    <h3>Custom link</h3>
    <label>Bitrate (bps, 0 = uncapped)</label>
    <input id="cl-bitrate" type="number" min="0" step="1">
    <label>Latency (ms)</label>
    <input id="cl-latency" type="number" min="0" step="1">
    <label>Jitter (± ms)</label>
    <input id="cl-jitter" type="number" min="0" step="1">
    <label>Frame loss (%)</label>
    <input id="cl-loss" type="number" min="0" max="100" step="0.1">
    <div class="modal-actions">
      <button class="cancel" onclick="closeCustomLinkModal()">Cancel</button>
      <button class="confirm" onclick="submitCustomLink()">Apply</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="new-server-modal">
  <div class="modal">
    <h3>New server</h3>
    <label>Name</label>
    <input id="ns-name" placeholder="my-server">
    <div class="modal-actions">
      <button class="cancel" onclick="closeNewServerModal()">Cancel</button>
      <button class="confirm" onclick="submitNewServer()">Create</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="new-channel-modal">
  <div class="modal">
    <h3 id="nc-title">New channel</h3>
    <label>Name</label>
    <input id="nc-name" placeholder="general">
    <div id="nc-access-row">
    <label>Access</label>
    <select id="nc-access">
      <option value="public">Public (open join)</option>
      <option value="invite">Invite-only</option>
    </select>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeNewChannelModal()">Cancel</button>
      <button class="confirm" onclick="submitNewChannel()">Create</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="members-modal">
  <div class="modal" style="width: min(420px, 90vw);">
    <h3>Members</h3>
    <div id="members-list"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeMembersModal()">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="permissions-modal">
  <div class="modal" style="width: min(420px, 90vw);">
    <h3>Role permissions</h3>
    <div id="permissions-editor"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closePermissionsModal()">Cancel</button>
      <button class="confirm" onclick="savePermissions()">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="network-modal">
  <div class="modal" style="width:min(560px, 92vw)">
    <h3>Network &mdash; <span id="net-title"></span></h3>
    <div id="net-content" style="max-height:60vh; overflow-y:auto; font-size:12px;"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="refreshNetworkModal()">Refresh</button>
      <button class="confirm" onclick="closeNetworkModal()">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="invite-modal">
  <div class="modal">
    <h3 id="inv-title">Invite a peer</h3>
    <label>Search</label>
    <input id="inv-search" placeholder="name or hash" oninput="searchDirectory()">
    <div class="directory-results" id="inv-results"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeInviteModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
let TESTERS = [];
let LINK_PROFILES = [];
let API_TOKEN = '';
let state = {};
// Per-tag cache of identity_hash -> data URL (or null if confirmed no avatar).
let avatarCache = {};
let emojiLibrary = {};
// identity_hash -> tag, populated as each tester's /me resolves.
let hashToTag = {};
let newChannelForTag = null;

function blankState(port) {
  return {
    port, me: null, channels: [], activeChannel: null, activeServer: null,
    servers: [], serverChannels: {}, serverPerms: {}, collapsedServers: new Set(),
    ws: null, invites: [], pendingImage: null, replyTarget: null,
    friends: [], friendRequests: {incoming: [], outgoing: []}, dms: [],
    net: { online: null, reconnecting: false }, killed: false,
    linkProfile: 'broadband', inVoice: false,
  };
}

function apiBase(tag) {
  return `http://${location.hostname}:${state[tag].port}`;
}
function wsBase(tag) {
  return `ws://${location.hostname}:${state[tag].port}`;
}
// The tester APIs require this token (see api.py). A WebSocket handshake and
// an <img> src can't carry a header, so those get it as a query parameter.
function tokenParam(sep) {
  return API_TOKEN ? `${sep}token=${encodeURIComponent(API_TOKEN)}` : '';
}
function withToken(opts) {
  const merged = Object.assign({}, opts);
  merged.headers = Object.assign({}, merged.headers || {},
      API_TOKEN ? {'X-TC-Token': API_TOKEN} : {});
  return merged;
}

function colsFor(n) {
  return n <= 6 ? Math.min(n, 3) : 4;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 3000);
}

function editDisplayName(tag) {
  const span = document.getElementById(`name-display-${tag}`);
  const current = span.textContent;
  const input = document.createElement('input');
  input.className = 'name-edit-input';
  input.value = current;
  span.replaceWith(input);
  input.focus();
  input.select();

  const save = async () => {
    const newName = input.value.trim() || current;
    const result = await api(tag, '/me/display_name', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({display_name: newName}),
    });
    state[tag].me.display_name = newName;
    span.textContent = newName;
    input.replaceWith(span);
    if (!result.ok) toast(`Tester ${tag}: rename failed`);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  input.addEventListener('blur', save, {once: true});
}

async function api(tag, path, opts) {
  const res = await fetch(apiBase(tag) + path, withToken(opts));
  if (!res.ok) throw new Error(`${tag} ${path} -> ${res.status}`);
  return res.json();
}

function applyVoiceState(tag, inVoice) {
  state[tag].inVoice = inVoice;
  const voiceBtn = document.getElementById(`voice-btn-${tag}`);
  if (voiceBtn) {
    voiceBtn.textContent = inVoice ? 'Leave voice' : 'Join voice';
    voiceBtn.classList.toggle('on', inVoice);
  }
  if (!inVoice) {
    // Leaving voice tears down the audio pipeline, which stops the tone.
    const toneBtn = document.getElementById(`tone-btn-${tag}`);
    if (toneBtn) { toneBtn.classList.remove('on'); toneBtn.textContent = 'Tone'; }
  }
}

async function refreshVoiceState(tag) {
  try {
    const status = await api(tag, '/voice/status');
    applyVoiceState(tag, status.channel !== null);
  } catch (e) { /* worker still starting; the next join/leave resyncs */ }
}

async function toggleVoice(tag) {
  if (state[tag].inVoice) {
    await api(tag, '/voice/leave', {method: 'POST'});
    applyVoiceState(tag, false);
    return;
  }
  const ch = state[tag].activeChannel;
  if (!ch) {
    toast(`Tester ${tag}: select a channel first`);
    return;
  }
  const result = await api(tag, `/channels/${ch}/voice/join`, {method: 'POST'});
  if (!result.ok) {
    toast(`Tester ${tag}: couldn't join voice (no permission, or the room is full)`);
    return;
  }
  applyVoiceState(tag, true);
}

async function toggleTone(tag) {
  const btn = document.getElementById(`tone-btn-${tag}`);
  const enable = !btn.classList.contains('on');
  const res = await fetch(apiBase(tag) + '/voice/test_tone', withToken({
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({enabled: enable}),
  }));
  if (res.status === 409) {
    toast(`Tester ${tag}: join a voice session first`);
    return;
  }
  if (!res.ok) {
    toast(`Tester ${tag}: tone toggle failed (${res.status})`);
    return;
  }
  btn.classList.toggle('on', enable);
  btn.textContent = enable ? 'Tone on' : 'Tone';
}

async function connectTester(tag) {
  for (let i = 0; i < 20; i++) {
    try {
      state[tag].me = await api(tag, '/me');
      break;
    } catch (e) {
      await new Promise(r => setTimeout(r, 500));
    }
  }
  if (!state[tag].me) {
    document.getElementById(`hash-${tag}`).textContent = 'failed to connect';
    return;
  }
  hashToTag[state[tag].me.hash_hex] = tag;
  const dot = document.getElementById(`dot-${tag}`);
  if (dot) { dot.classList.remove('stopped'); dot.classList.add('up'); }
  document.getElementById(`hash-${tag}`).textContent = state[tag].me.hash_hex.slice(0, 16) + '…';
  document.getElementById(`name-display-${tag}`).textContent = state[tag].me.display_name;

  loadCollapsed(tag);
  await refreshChannels(tag);
  await refreshDiscovered(tag);
  await refreshInvites(tag);
  await refreshFriends(tag);
  refreshVoiceState(tag);
  connectWs(tag);
  refreshOwnAvatar(tag);
  refreshEmojiLibrary(tag);
  try {
    const net = await api(tag, '/net/status');
    applyNetStatus(tag, net.online);
  } catch (e) {
    // transient -- next net_status WS event will catch up
  }
  applyProcState(tag);
}

function avatarDataUrl(b64) {
  return b64 ? `data:image/jpeg;base64,${b64}` : null;
}

function applyAvatar(el, dataUrl) {
  if (!el) return;
  el.style.backgroundImage = dataUrl ? `url(${dataUrl})` : 'none';
}

async function refreshOwnAvatar(tag) {
  const res = await api(tag, '/me/avatar');
  const url = avatarDataUrl(res.avatar_data_b64);
  avatarCache[tag][state[tag].me.hash_hex] = url;
  applyAvatar(document.getElementById(`avatar-${tag}`), url);
}

async function getPeerAvatarUrl(tag, hash) {
  if (hash in avatarCache[tag]) return avatarCache[tag][hash];
  try {
    const res = await api(tag, `/peers/${hash}/avatar`);
    const url = avatarDataUrl(res.avatar_data_b64);
    avatarCache[tag][hash] = url;
    return url;
  } catch (e) {
    return null;
  }
}

function uploadAvatar(tag) {
  const input = document.getElementById(`avatar-file-${tag}`);
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = reader.result.split(',')[1];
    try {
      await api(tag, '/me/avatar', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image_data_b64: b64}),
      });
      await refreshOwnAvatar(tag);
    } catch (e) {
      toast(`Tester ${tag}: avatar update failed`);
    }
  };
  reader.readAsDataURL(file);
  input.value = '';
}

// Peer strip chips reflect authoritative orchestrator /status, not gossip
// presence -- announces are damped by the hub and gossip presence decays to
// permanently-offline through it. Three states: process stopped, link down, up.
function setPeerChipState(tag, otherTag, testerStatus) {
  const dot = document.getElementById(`peer-dot-${tag}-${otherTag}`);
  if (!dot) return;
  dot.classList.remove('up', 'stopped', 'down');
  let title, cls;
  if (!testerStatus || !testerStatus.alive) {
    cls = 'stopped'; title = `Tester ${otherTag}: process stopped`;
  } else if (testerStatus.link_online) {
    cls = 'up'; title = `Tester ${otherTag}: online`;
  } else {
    cls = 'down'; title = `Tester ${otherTag}: link down`;
  }
  dot.classList.add(cls);
  dot.title = title;
}

async function refreshTesterStatus() {
  let testers;
  try {
    testers = (await (await fetch('/status')).json()).testers;
  } catch (e) {
    return; // transient -- next poll will catch up
  }
  TESTERS.forEach(tag => {
    TESTERS.filter(o => o !== tag).forEach(otherTag => {
      setPeerChipState(tag, otherTag, testers[otherTag]);
    });
    const st = testers[tag];
    if (st && st.link_profile && customLinkForTag !== tag) {
      applyLinkProfile(tag, st.link_profile, st.link_summary, st.bitrate_hint_stale);
    }
  });
}

function applyNetStatus(tag, online) {
  state[tag].net.online = online;
  state[tag].net.reconnecting = false;
  const pane = document.getElementById(`pane-${tag}`);
  if (pane) pane.classList.toggle('offline', !online);
  const btn = document.getElementById(`link-btn-${tag}`);
  if (btn) {
    btn.disabled = state[tag].killed;
    btn.textContent = online ? 'Go offline' : 'Go online';
  }
}

function applyProcState(tag) {
  const killBtn = document.getElementById(`kill-btn-${tag}`);
  const startBtn = document.getElementById(`start-btn-${tag}`);
  const linkBtn = document.getElementById(`link-btn-${tag}`);
  const killed = state[tag].killed;
  if (killBtn) killBtn.style.display = killed ? 'none' : '';
  if (startBtn) startBtn.style.display = killed ? '' : 'none';
  if (linkBtn) linkBtn.disabled = killed;
}

function applyLinkProfile(tag, profileName, summary, hintStale) {
  state[tag].linkProfile = profileName;
  const sel = document.getElementById(`link-profile-${tag}`);
  if (sel) {
    sel.value = profileName;
    sel.classList.toggle('shaped', summary !== 'unshaped');
    sel.title = `Simulated link: ${summary}`;
  }
  const hint = document.getElementById(`restart-hint-${tag}`);
  if (hint) hint.classList.toggle('show', !!hintStale);
}

async function postLinkProfile(tag, body) {
  let res;
  try {
    res = await (await fetch(`/testers/${tag}/link_profile`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
  } catch (e) {
    toast('Could not set link profile');
    return;
  }
  if (!res.ok) {
    toast(res.error || 'Could not set link profile');
    return;
  }
  applyLinkProfile(tag, body.profile, res.profile.summary,
                   res.restart_required_for_bitrate_hint);
  toast(`Tester ${tag}: ${res.profile.label} (${res.profile.summary})`);
}

function onLinkProfileChange(tag, value) {
  if (value === 'custom') { openCustomLinkModal(tag); return; }
  postLinkProfile(tag, { profile: value });
}

let customLinkForTag = null;

function openCustomLinkModal(tag) {
  customLinkForTag = tag;
  const base = LINK_PROFILES.find(p => p.name === 'custom') || {};
  document.getElementById('cl-bitrate').value = base.bitrate_bps || 0;
  document.getElementById('cl-latency').value = base.latency_ms || 0;
  document.getElementById('cl-jitter').value = base.jitter_ms || 0;
  document.getElementById('cl-loss').value = base.loss_pct || 0;
  document.getElementById('custom-link-modal').classList.add('show');
}

function closeCustomLinkModal() {
  document.getElementById('custom-link-modal').classList.remove('show');
  // The select still shows "Custom..."; put it back to what is actually applied.
  const tag = customLinkForTag;
  customLinkForTag = null;
  if (tag) {
    const sel = document.getElementById(`link-profile-${tag}`);
    if (sel) sel.value = state[tag].linkProfile;
  }
}

function submitCustomLink() {
  const tag = customLinkForTag;
  if (!tag) return;
  const body = {
    profile: 'custom',
    bitrate_bps: Number(document.getElementById('cl-bitrate').value) || 0,
    latency_ms: Number(document.getElementById('cl-latency').value) || 0,
    jitter_ms: Number(document.getElementById('cl-jitter').value) || 0,
    loss_pct: Number(document.getElementById('cl-loss').value) || 0,
  };
  customLinkForTag = null;
  document.getElementById('custom-link-modal').classList.remove('show');
  postLinkProfile(tag, body);
}

function toggleLink(tag) {
  if (state[tag].net.online) goOffline(tag); else goOnline(tag);
}

async function goOffline(tag) {
  const btn = document.getElementById(`link-btn-${tag}`);
  if (btn) btn.disabled = true;
  try {
    await api(tag, '/net/offline', {method: 'POST'});
  } catch (e) {
    toast(`Tester ${tag}: offline request failed`);
  }
  if (btn) btn.disabled = state[tag].killed;
}

async function goOnline(tag) {
  const btn = document.getElementById(`link-btn-${tag}`);
  state[tag].net.reconnecting = true;
  if (btn) { btn.disabled = true; btn.textContent = 'reconnecting…'; }
  try {
    await api(tag, '/net/online', {method: 'POST'});
  } catch (e) {
    toast(`Tester ${tag}: online request failed`);
    state[tag].net.reconnecting = false;
    if (btn) { btn.disabled = state[tag].killed; btn.textContent = 'Go online'; }
  }
}

async function killTester(tag) {
  state[tag].killed = true;
  applyProcState(tag);
  try {
    await fetch(`/testers/${tag}/kill`, {method: 'POST'});
  } catch (e) {
    toast(`Tester ${tag}: kill request failed`);
  }
}

async function startTester(tag) {
  try {
    const res = await fetch(`/testers/${tag}/start`, {method: 'POST'});
    const body = await res.json();
    if (!body.ok && body.error !== 'already running') {
      toast(`Tester ${tag}: start failed`);
      return;
    }
  } catch (e) {
    toast(`Tester ${tag}: start request failed`);
    return;
  }
  state[tag].killed = false;
  applyProcState(tag);
  await connectTester(tag);
}

function connectWs(tag) {
  const ws = new WebSocket(wsBase(tag) + '/ws' + tokenParam('?'));
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'message' && msg.channel_hash === state[tag].activeChannel) {
      renderMessages(tag);
    } else if (msg.type === 'invite_received') {
      toast(`Tester ${tag}: invite received for #${msg.channel_name}`);
      refreshInvites(tag);
    } else if (msg.type === 'channel_joined' || msg.type === 'member_list_updated') {
      refreshChannels(tag);
      if (msg.channel_hash === state[tag].activeChannel) {
        renderMessages(tag);
        if (membersModalTag === tag) refreshMembersModal();
      }
    } else if (msg.type === 'friend_request') {
      const who = msg.display_name || msg.identity_hash.slice(0, 10);
      toast(`Tester ${tag}: friend request from ${who}`);
      refreshFriends(tag);
    } else if (msg.type === 'friend_updated') {
      refreshFriends(tag);
      refreshChannels(tag);
    } else if (msg.type === 'channel_discovered') {
      toast(`Tester ${tag}: discovered #${msg.channel_name}`);
      refreshDiscovered(tag);
    } else if (msg.type === 'net_status') {
      applyNetStatus(tag, msg.online);
    } else if (msg.type === 'avatar_updated') {
      delete avatarCache[tag][msg.identity_hash];
      if (state[tag].me && msg.identity_hash === state[tag].me.hash_hex) refreshOwnAvatar(tag);
      if (state[tag].activeChannel) renderMessages(tag);
    } else if (msg.type === 'reaction_updated') {
      if (msg.channel_hash === state[tag].activeChannel) renderMessages(tag);
    } else if (msg.type === 'sync_status') {
      if (msg.channel_hash === state[tag].activeChannel) refreshSyncStatus(tag);
    } else if (msg.type === 'emoji_received') {
      refreshEmojiLibrary(tag).then(() => {
        if (state[tag].activeChannel) renderMessages(tag);
      });
    } else if (msg.type === 'voice_session') {
      applyVoiceState(tag, msg.state === 'joined' || msg.state === 'audio_error');
    }
  };
  ws.onclose = () => {
    if (state[tag].killed) {
      const dot = document.getElementById(`dot-${tag}`);
      if (dot) { dot.classList.remove('up'); dot.classList.add('stopped'); }
      const hashEl = document.getElementById(`hash-${tag}`);
      if (hashEl) hashEl.textContent = 'PROCESS STOPPED';
    }
    setTimeout(() => connectWs(tag), 2000);
  };
  state[tag].ws = ws;
}

async function refreshInvites(tag) {
  state[tag].invites = await api(tag, '/invites');
  const bar = document.getElementById(`invite-bar-${tag}`);
  const text = document.getElementById(`invite-text-${tag}`);
  if (state[tag].invites.length === 0) {
    bar.classList.remove('show');
    return;
  }
  const inv = state[tag].invites[0];
  const more = state[tag].invites.length > 1 ? ` (+${state[tag].invites.length - 1} more)` : '';
  const label = inv.scope_kind === 'server'
    ? `server ${inv.channel_name} (all its channels)`
    : `#${inv.channel_name}`;
  text.textContent = `Invited to ${label}${more}`;
  bar.classList.add('show');
  bar.dataset.channelHash = inv.channel_hash_hex;
}

async function respondInvite(tag, accept) {
  const bar = document.getElementById(`invite-bar-${tag}`);
  const channelHash = bar.dataset.channelHash;
  if (!channelHash) return;
  await api(tag, `/invites/${channelHash}/${accept ? 'accept' : 'decline'}`, {method: 'POST'});
  await refreshInvites(tag);
  if (accept) toast(`Tester ${tag}: join request sent, waiting for admin approval`);
}

// --- friends, requests and conversations ---
//
// Mirrors the invite bar above it: an incoming request raises a bar with
// Accept/Decline, because a friendship needs both sides before a direct
// message passes either way.

async function refreshFriends(tag) {
  const s = state[tag];
  s.friends = await api(tag, '/friends');
  s.friendRequests = await api(tag, '/friends/requests');

  const box = document.getElementById(`friends-${tag}`);
  if (box) {
    const rows = s.friends.map(f => {
      const name = escapeHtml(f.nickname || f.display_name || f.identity_hash.slice(0, 8));
      return `<div class="channel-item" onclick="startDm('${tag}', '${f.identity_hash}')"
          title="Open a direct message with this friend">
          <span class="status-dot ${f.is_online ? 'up' : ''}"></span> ${name}</div>`;
    });
    const waiting = s.friendRequests.outgoing.length;
    if (waiting) {
      rows.push(`<div class="empty-state">${waiting} request(s) awaiting a reply</div>`);
    }
    box.innerHTML = rows.length ? rows.join('')
      : '<div class="empty-state">No friends yet</div>';
  }

  const bar = document.getElementById(`friend-bar-${tag}`);
  const text = document.getElementById(`friend-text-${tag}`);
  if (!bar || !text) return;
  const incoming = s.friendRequests.incoming;
  if (incoming.length === 0) {
    bar.classList.remove('show');
    return;
  }
  const req = incoming[0];
  const more = incoming.length > 1 ? ` (+${incoming.length - 1} more)` : '';
  const who = escapeHtml(req.display_name || req.identity_hash.slice(0, 10));
  // The note is text the peer wrote; it is shown, never acted on.
  const note = req.note ? ` -- "${escapeHtml(req.note)}"` : '';
  text.textContent = `${who} wants to be friends${note}${more}`;
  bar.classList.add('show');
  bar.dataset.peerHash = req.identity_hash;
}

async function respondFriendRequest(tag, accept) {
  const bar = document.getElementById(`friend-bar-${tag}`);
  const peerHash = bar.dataset.peerHash;
  if (!peerHash) return;
  await api(tag, `/friends/requests/${peerHash}/${accept ? 'accept' : 'decline'}`,
            {method: 'POST', headers: {'Content-Type': 'application/json'},
             body: JSON.stringify({nickname: ''})});
  await refreshFriends(tag);
  await refreshChannels(tag);
  if (accept) toast(`Tester ${tag}: friend added`);
}

async function startDm(tag, peerHash) {
  const res = await api(tag, `/dms/${peerHash}`, {method: 'POST'});
  if (!res || !res.hash) {
    toast(`Tester ${tag}: cannot message a peer who is not an accepted friend`);
    return;
  }
  await refreshChannels(tag);
  await selectChannel(tag, res.hash);
}

function dmForHash(tag, hash) {
  return (state[tag].dms || []).find(d => d.hash === hash) || null;
}

function channelItemHtml(tag, c, indented) {
  const active = c.hash === state[tag].activeChannel ? 'active' : '';
  const style = indented ? ' style="margin-left:10px;"' : '';
  const badge = indented ? '' :
    `<span class="badge">${c.open_join ? 'public' : 'invite-only'}</span>`;
  return `<div class="channel-item ${active}"${style}
      onclick="selectChannel('${tag}', '${c.hash}')">#${c.name}${badge}</div>`;
}

async function refreshChannels(tag) {
  const s = state[tag];
  s.servers = await api(tag, '/servers');
  s.channels = await api(tag, '/channels');

  // A server's channels and our permissions on it, fetched per server so the
  // "+" affordance below reflects the real CREATE_CHANNEL grant.
  await Promise.all(s.servers.map(async srv => {
    s.serverChannels[srv.hash] = await api(tag, `/servers/${srv.hash}/channels`);
    s.serverPerms[srv.hash] = await api(tag, `/servers/${srv.hash}/my_permissions`);
  }));

  const parts = [];
  for (const srv of s.servers) {
    const perms = s.serverPerms[srv.hash] || {};
    const collapsed = s.collapsedServers.has(srv.hash);
    const children = s.serverChannels[srv.hash] || [];
    const plus = perms.create_channel
      ? `<span class="srv-add" title="New channel in this server"
             onclick="event.stopPropagation(); openNewChannelModal('${tag}', '${srv.hash}')">+</span>`
      : '';
    // Collapsing hides the channels but must not hide unread activity, so the
    // count of what's tucked away rides on the header.
    const badge = collapsed && children.length
      ? `<span class="srv-count">${children.length}</span>` : '';
    parts.push(`<div class="server-item" onclick="selectServer('${tag}', '${srv.hash}')">
        <span><span class="srv-caret">${collapsed ? '▸' : '▾'}</span> ${srv.name}</span>
        <span>${badge}${plus}</span></div>`);
    if (collapsed) continue;
    parts.push(children.length
      ? children.map(c => channelItemHtml(tag, c, true)).join('')
      : '<div class="empty-state" style="padding:2px 0 2px 14px;">No channels</div>');
  }
  if (s.channels.length) {
    if (s.servers.length) parts.push('<div class="discovered-header">Channels</div>');
    parts.push(s.channels.map(c => channelItemHtml(tag, c, false)).join(''));
  }
  // A conversation is addressed exactly like a channel, so it lists and reads
  // through the same path -- only sending differs (see sendMessage).
  s.dms = await api(tag, '/dms');
  if (s.dms.length) {
    parts.push('<div class="discovered-header">Direct messages</div>');
    parts.push(s.dms.map(d => dmItemHtml(tag, d)).join(''));
  }
  const list = document.getElementById(`channels-${tag}`);
  list.innerHTML = parts.length ? parts.join('')
    : '<div class="empty-state">No channels yet</div>';
}

function dmItemHtml(tag, d) {
  const active = d.hash === state[tag].activeChannel ? 'active' : '';
  const name = escapeHtml(d.display_name || d.peer_hash.slice(0, 8));
  const unread = d.unread ? `<span class="badge">${d.unread}</span>` : '';
  // A conversation with someone no longer held as a friend stays readable and
  // says so: nothing can pass either way until both sides hold the other.
  const gone = d.is_friend ? '' : '<span class="badge">not a friend</span>';
  return `<div class="channel-item ${active}"
      onclick="selectChannel('${tag}', '${d.hash}')">@${name}${unread}${gone}</div>`;
}

function selectServer(tag, serverHash) {
  // Clicking the header both selects the server (so the toolbar acts on it)
  // and toggles its channels.
  const s = state[tag];
  s.activeServer = serverHash;
  if (s.collapsedServers.has(serverHash)) s.collapsedServers.delete(serverHash);
  else s.collapsedServers.add(serverHash);
  persistCollapsed(tag);
  refreshChannels(tag);
}

const COLLAPSED_KEY = 'trenchchat.collapsedServers';

function persistCollapsed(tag) {
  try {
    localStorage.setItem(`${COLLAPSED_KEY}.${tag}`,
                         JSON.stringify([...state[tag].collapsedServers]));
  } catch (e) { /* private mode: collapse just won't survive a reload */ }
}

function loadCollapsed(tag) {
  try {
    const raw = localStorage.getItem(`${COLLAPSED_KEY}.${tag}`);
    if (raw) state[tag].collapsedServers = new Set(JSON.parse(raw));
  } catch (e) { /* ignore */ }
}

async function refreshDiscovered(tag) {
  const discovered = await api(tag, '/channels/discovered');
  const box = document.getElementById(`discovered-${tag}`);
  if (discovered.length === 0) {
    box.innerHTML = '<div class="empty-state" style="padding:4px 0;">None yet</div>';
    return;
  }
  box.innerHTML = discovered.map(c => `
    <div class="discovered-item">
      <span>#${c.name}</span>
      <button onclick="joinDiscoveredChannel('${tag}', '${c.hash}')">Join</button>
    </div>
  `).join('');
}

async function joinDiscoveredChannel(tag, hash) {
  const result = await api(tag, `/channels/${hash}/join`, {method: 'POST'});
  if (!result.ok) { toast(`Tester ${tag}: join failed`); return; }
  await refreshChannels(tag);
  await refreshDiscovered(tag);
  await selectChannel(tag, hash);
}

async function selectChannel(tag, hash) {
  state[tag].activeChannel = hash;
  clearReplyTarget(tag);
  clearPendingImage(tag);
  await refreshChannels(tag);
  const dm = dmForHash(tag, hash);
  const ch = state[tag].channels.find(c => c.hash === hash);
  const label = document.getElementById(`active-channel-${tag}`);
  label.textContent = dm ? `@${dm.display_name || dm.peer_hash.slice(0, 8)}`
                         : (ch ? `#${ch.name}` : hash);
  await renderMessages(tag);
  if (dm) {
    // A conversation has no subscription and so no sync state, by design.
    document.getElementById(`sync-status-${tag}`).textContent = '';
    await api(tag, `/dms/${hash}/read`, {method: 'POST'});
    await refreshChannels(tag);
  } else {
    await refreshSyncStatus(tag);
  }
}

function syncStatusLabel(status) {
  const answered = status.peers.filter(p => p.state === 'answered');
  const pending = status.peers.filter(p => p.state === 'pending');
  const names = ps => ps.map(p => p.display_name || p.identity_hash.slice(0, 8)).join(', ');
  switch (status.state) {
    case 'syncing':
      return `⟳ syncing with ${names(pending)}`;
    case 'synced':
      return status.received_count
        ? `✓ up to date — ${status.received_count} synced from ${names(answered)}`
        : '✓ up to date';
    case 'incomplete':
      return '⚠ history still missing';
    case 'waiting':
      return '⋯ no peer reachable';
    default:
      return '';
  }
}

async function refreshSyncStatus(tag) {
  const el = document.getElementById(`sync-status-${tag}`);
  if (!el) return;
  if (!state[tag].activeChannel) {
    el.textContent = '';
    return;
  }
  const status = await api(tag, `/channels/${state[tag].activeChannel}/sync_status`);
  el.className = `sync-status ${status.state}`;
  el.textContent = syncStatusLabel(status);
}

async function renderMessages(tag) {
  if (!state[tag].activeChannel) return;
  const msgs = await api(tag, `/channels/${state[tag].activeChannel}/messages`);
  const box = document.getElementById(`messages-${tag}`);
  if (msgs.length === 0) {
    box.innerHTML = '<div class="empty-state">No messages yet</div>';
    return;
  }
  const myHash = state[tag].me.hash_hex;
  const byId = Object.fromEntries(msgs.map(m => [m.message_id, m]));
  const rendered = await Promise.all(msgs.map(async m => {
    const avatarUrl = await getPeerAvatarUrl(tag, m.sender_hash);
    const style = avatarUrl ? ` style="background-image:url(${avatarUrl})"` : '';
    const chips = (m.reactions || []).map(r => reactionChipHtml(tag, m.message_id, r)).join('');
    const quoted = m.reply_to && byId[m.reply_to];
    const quoteHtml = quoted ? `
      <div class="reply-quote">
        <b>${escapeHtml(quoted.sender_name || quoted.sender_hash.slice(0, 8))}</b>
        ${escapeHtml((quoted.content || '(image)').slice(0, 60))}
      </div>` : '';
    return `
    <div class="msg ${m.sender_hash === myHash ? 'self' : ''}">
      <div class="msg-row">
        <span class="avatar-thumb-sm"${style}></span>
        <div class="msg-body">
          ${quoteHtml}
          <span class="sender">${escapeHtml(m.sender_name || m.sender_hash.slice(0, 8))}</span>
          <span class="content">${renderContent(tag, m.content)}</span>
          <button class="reply-btn" onclick='setReplyTarget("${tag}", ${JSON.stringify(m.message_id)}, ${JSON.stringify(m.sender_name || m.sender_hash.slice(0, 8))}, ${JSON.stringify(m.content || "(image)")})'>reply</button>
          <button class="react-btn" onclick="toggleEmojiPicker(event, '${tag}', '${m.message_id}')">+react</button>
          ${m.has_image ? `<img class="attached" src="${apiBase(tag)}/channels/${state[tag].activeChannel}/messages/${m.message_id}/image${tokenParam('?')}">` : ''}
          <div class="reactions">${chips}</div>
        </div>
      </div>
    </div>`;
  }));
  box.innerHTML = rendered.join('');
  box.scrollTop = box.scrollHeight;
}

function setReplyTarget(tag, messageId, senderName, content) {
  state[tag].replyTarget = messageId;
  const bar = document.getElementById(`reply-bar-${tag}`);
  bar.innerHTML = `
    <span>Replying to <b>${escapeHtml(senderName)}</b>: ${escapeHtml(content.slice(0, 60))}</span>
    <button onclick="clearReplyTarget('${tag}')">&times;</button>
  `;
  bar.classList.add('show');
  document.getElementById(`compose-${tag}`).focus();
}

function clearReplyTarget(tag) {
  state[tag].replyTarget = null;
  const bar = document.getElementById(`reply-bar-${tag}`);
  bar.classList.remove('show');
  bar.innerHTML = '';
}

function onImageSelected(tag, file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    // reader.result is "data:image/png;base64,AAAA..." -- keep just the b64 part.
    state[tag].pendingImage = reader.result.split(',')[1];
    const preview = document.getElementById(`image-preview-${tag}`);
    preview.innerHTML = `
      <img src="${reader.result}">
      <button class="remove-img" onclick="clearPendingImage('${tag}')">Remove</button>
    `;
    preview.classList.add('show');
  };
  reader.readAsDataURL(file);
}

function clearPendingImage(tag) {
  state[tag].pendingImage = null;
  document.getElementById(`file-input-${tag}`).value = '';
  const preview = document.getElementById(`image-preview-${tag}`);
  preview.classList.remove('show');
  preview.innerHTML = '';
}

function sniffImageMime(b64) {
  const bytes = atob(b64.slice(0, 12));
  if (bytes.startsWith('\x89PNG')) return 'image/png';
  if (bytes.startsWith('\xff\xd8')) return 'image/jpeg';
  if (bytes.startsWith('GIF8')) return 'image/gif';
  return 'image/png';
}

// Mirrors emoji_text.dart's emojiSpans: :name@hexhash: resolves by hash,
// legacy :name: by an exact name match. Unresolved tokens stay literal text.
const EMOJI_TOKEN_RE = /:([a-zA-Z0-9_-]+)(?:@([0-9a-fA-F]{64}))?:/g;

function renderContent(tag, content) {
  const text = content || '';
  const lib = emojiLibrary[tag] || [];
  if (!text.includes(':') || lib.length === 0) return escapeHtml(text);

  let out = '';
  let last = 0;
  for (const m of text.matchAll(EMOJI_TOKEN_RE)) {
    const [name, hash] = [m[1], m[2]];
    const entry = hash
      ? lib.find(e => e.emoji_hash.toLowerCase() === hash.toLowerCase())
      : lib.find(e => e.name === name);
    if (!entry) continue;
    out += escapeHtml(text.slice(last, m.index));
    out += `<img class="inline-emoji" title=":${escapeHtml(entry.name)}"
        src="data:${sniffImageMime(entry.image_data_b64)};base64,${entry.image_data_b64}">`;
    last = m.index + m[0].length;
  }
  return out === '' ? escapeHtml(text) : out + escapeHtml(text.slice(last));
}

function reactionChipHtml(tag, messageId, r) {
  const entry = (emojiLibrary[tag] || []).find(e => e.emoji_hash === r.emoji_hash);
  const img = entry
    ? `<img src="data:${sniffImageMime(entry.image_data_b64)};base64,${entry.image_data_b64}">`
    : '';
  return `<span class="reaction-chip ${r.reacted_by_me ? 'mine' : ''}"
      onclick="toggleReaction('${tag}', '${messageId}', '${r.emoji_hash}', ${r.reacted_by_me})">
      ${img}<span>${r.count}</span>
    </span>`;
}

async function refreshEmojiLibrary(tag) {
  emojiLibrary[tag] = await api(tag, '/emoji');
}

let openPicker = null;

function closeEmojiPicker() {
  if (openPicker) { openPicker.el.remove(); openPicker = null; }
}
document.addEventListener('click', (e) => {
  if (openPicker && !openPicker.el.contains(e.target)) closeEmojiPicker();
});

async function toggleEmojiPicker(evt, tag, messageId) {
  evt.stopPropagation();
  if (openPicker && openPicker.messageId === messageId) { closeEmojiPicker(); return; }
  closeEmojiPicker();
  await refreshEmojiLibrary(tag);
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  const rect = evt.target.getBoundingClientRect();
  picker.style.left = `${rect.left + window.scrollX}px`;
  picker.style.top = `${rect.bottom + window.scrollY + 4}px`;
  const items = emojiLibrary[tag];
  const itemsHtml = items.length === 0
    ? '<div class="empty-state">No emoji yet</div>'
    : items.map(e => `<img src="data:${sniffImageMime(e.image_data_b64)};base64,${e.image_data_b64}"
        title="${escapeHtml(e.name)}" onclick="pickEmoji('${tag}', '${messageId}', '${e.emoji_hash}')">`).join('');
  picker.innerHTML = itemsHtml + `<div class="import-row">
      <label>Import emoji...<input type="file" accept="image/*" style="display:none"
          onchange="importEmoji(event, '${tag}', '${messageId}')"></label>
    </div>`;
  document.body.appendChild(picker);
  openPicker = { el: picker, tag, messageId };
}

function pickEmoji(tag, messageId, emojiHash) {
  closeEmojiPicker();
  toggleReaction(tag, messageId, emojiHash, false);
}

function importEmoji(evt, tag, messageId) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = reader.result.split(',')[1];
    try {
      const res = await api(tag, '/emoji/import', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: file.name.replace(/\.[^.]+$/, ''), image_data_b64: b64}),
      });
      closeEmojiPicker();
      await refreshEmojiLibrary(tag);
      await toggleReaction(tag, messageId, res.emoji_hash, false);
    } catch (e) {
      toast(`Tester ${tag}: emoji import failed`);
    }
  };
  reader.readAsDataURL(file);
}

async function toggleReaction(tag, messageId, emojiHash, alreadyMine) {
  try {
    if (alreadyMine) {
      await api(tag, `/channels/${state[tag].activeChannel}/messages/${messageId}/reactions/${emojiHash}`,
          {method: 'DELETE'});
    } else {
      await api(tag, `/channels/${state[tag].activeChannel}/messages/${messageId}/reactions`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({emoji_hash: emojiHash}),
      });
    }
  } catch (e) {
    toast(`Tester ${tag}: reaction failed`);
  }
  await renderMessages(tag);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function sendMessage(tag) {
  const input = document.getElementById(`compose-${tag}`);
  const content = input.value.trim();
  const image = state[tag].pendingImage;
  const replyTo = state[tag].replyTarget;
  if ((!content && !image) || !state[tag].activeChannel) return;
  input.value = '';
  clearPendingImage(tag);
  clearReplyTarget(tag);
  // A conversation is addressed by its peer, not by the conversation hash:
  // the receiver recomputes that address from the sender it authenticated.
  const dm = dmForHash(tag, state[tag].activeChannel);
  const path = dm ? `/dms/${dm.peer_hash}/messages`
                  : `/channels/${state[tag].activeChannel}/messages`;
  const result = await api(tag, path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content, image_data_b64: image, reply_to: replyTo}),
  });
  if (!result.ok) {
    toast(dm ? `Tester ${tag}: not sent -- still friends?`
             : `Tester ${tag}: message not sent (permission?)`);
  }
  await renderMessages(tag);
}

let membersModalTag = null;

async function openMembersModal(tag) {
  if (!scopeFor(tag)) { toast('Select a channel or server first'); return; }
  membersModalTag = tag;
  document.getElementById('members-modal').classList.add('show');
  await refreshMembersModal();
}

function closeMembersModal() {
  membersModalTag = null;
  document.getElementById('members-modal').classList.remove('show');
}

async function refreshMembersModal() {
  const tag = membersModalTag;
  const scope = tag ? scopeFor(tag) : null;
  if (!scope) return;
  const [members, perms] = await Promise.all([
    api(tag, `/${scope.kind}/${scope.hash}/members`),
    api(tag, `/${scope.kind}/${scope.hash}/my_permissions`),
  ]);
  const myHash = state[tag].me.hash_hex;
  const list = document.getElementById('members-list');
  list.innerHTML = members.map(m => {
    const isSelf = m.identity_hash === myHash;
    const actions = [];
    if (!isSelf && m.role !== 'owner') {
      if (perms.kick) {
        actions.push(`<button class="kick" onclick="kickMember('${m.identity_hash}')">Kick</button>`);
      }
      if (perms.manage_roles) {
        if (m.role === 'admin') {
          actions.push(`<button class="demote" onclick="demoteMember('${m.identity_hash}')">Demote</button>`);
        } else {
          actions.push(`<button class="promote" onclick="promoteMember('${m.identity_hash}')">Promote</button>`);
        }
      }
    }
    return `
      <div class="member-row">
        <span class="member-hash">${m.identity_hash.slice(0, 20)}…${isSelf ? ' (you)' : ''}</span>
        <span class="member-role">${m.role}</span>
        <span class="member-actions">${actions.join('')}</span>
      </div>
    `;
  }).join('') || '<div class="empty-state">No members</div>';
}

async function updateRoles(body) {
  const tag = membersModalTag;
  const scope = tag ? scopeFor(tag) : null;
  if (!scope) return;
  await api(tag, `/${scope.kind}/${scope.hash}/roles`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  await refreshMembersModal();
}

const kickMember    = h => updateRoles({remove_members: [h]});
const promoteMember = h => updateRoles({add_admins: [h]});
const demoteMember  = h => updateRoles({remove_admins: [h]});

let permissionsModalTag = null;

// Membership, roles and permissions live on the server for any channel inside
// one, so those all address the server scope. Returns null when nothing is
// selected.
function scopeFor(tag) {
  const s = state[tag];
  const ch = s.activeChannel;
  if (ch) {
    const row = (s.servers.flatMap(srv => s.serverChannels[srv.hash] || [])
                 .concat(s.channels)).find(c => c.hash === ch);
    if (row && row.server_hash) {
      const srv = s.servers.find(x => x.hash === row.server_hash);
      return {kind: 'servers', hash: row.server_hash, name: srv ? srv.name : 'server'};
    }
    return {kind: 'channels', hash: ch, name: row ? `#${row.name}` : 'channel'};
  }
  if (s.activeServer) {
    const srv = s.servers.find(x => x.hash === s.activeServer);
    return {kind: 'servers', hash: s.activeServer, name: srv ? srv.name : 'server'};
  }
  return null;
}

async function openPermissionsModal(tag) {
  const scope = scopeFor(tag);
  if (!scope) { toast('Select a channel or server first'); return; }
  permissionsModalTag = tag;
  const perms = await api(tag, `/${scope.kind}/${scope.hash}/permissions`);
  const isServer = scope.kind === 'servers';
  const editor = document.getElementById('permissions-editor');
  editor.innerHTML = `
    <div class="empty-state" style="padding: 0 0 8px;">
      Editing <strong>${scope.name}</strong>${isServer
        ? ' — applies to every channel in this server' : ''}
    </div>
    <table class="perm-table">
      <tr><th>Permission</th><th>Admin</th><th>Member</th></tr>
      ${perms.all_permissions.map(p => `
        <tr>
          <td>${p}</td>
          <td><input type="checkbox" data-role="admin" data-perm="${p}" ${perms.admin.includes(p) ? 'checked' : ''}></td>
          <td><input type="checkbox" data-role="member" data-perm="${p}" ${perms.member.includes(p) ? 'checked' : ''}></td>
        </tr>
      `).join('')}
    </table>
    <div class="empty-state" style="padding: 8px 0 0;">Owner always has every permission.</div>
  `;
  document.getElementById('permissions-modal').classList.add('show');
}

function closePermissionsModal() {
  permissionsModalTag = null;
  document.getElementById('permissions-modal').classList.remove('show');
}

async function savePermissions() {
  const tag = permissionsModalTag;
  if (!tag) return;
  const scope = scopeFor(tag);
  if (!scope) { closePermissionsModal(); return; }
  const boxes = document.querySelectorAll('#permissions-editor input[type=checkbox][data-role]');
  const admin = [], member = [];
  boxes.forEach(b => {
    if (b.checked) (b.dataset.role === 'admin' ? admin : member).push(b.dataset.perm);
  });
  const result = await api(tag, `/${scope.kind}/${scope.hash}/permissions`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({admin, member}),
  });
  if (result.error) {
    toast(`Tester ${tag}: ${result.error}`);
  } else if (!result.ok) {
    toast(`Tester ${tag}: permission change denied (missing manage_channel?)`);
  }
  closePermissionsModal();
  await refreshChannels(tag);
}

let networkForTag = null;

async function openNetworkModal(tag) {
  networkForTag = tag;
  document.getElementById('net-title').textContent = `Tester ${tag}`;
  document.getElementById('network-modal').classList.add('show');
  await refreshNetworkModal();
}
function closeNetworkModal() {
  document.getElementById('network-modal').classList.remove('show');
  networkForTag = null;
}
async function refreshNetworkModal() {
  if (!networkForTag) return;
  const tag = networkForTag;
  const [map, ifaces] = await Promise.all([
    api(tag, '/network/map'),
    api(tag, '/reticulum/interfaces'),
  ]);
  const ifaceRows = ifaces.map(i => `
    <tr>
      <td>${escapeHtml(i.name)}</td><td>${escapeHtml(i.type)}</td>
      <td>${i.enabled ? 'yes' : 'no'}</td>
      <td>${i.status === null ? '—' : (i.status ? 'online' : 'offline')}</td>
      <td>${i.rxb ?? '—'}</td><td>${i.txb ?? '—'}</td>
    </tr>`).join('');
  const nodeRows = map.nodes.map(n => `
    <tr><td>${escapeHtml(n.label || n.id.slice(0, 10))}</td><td>${n.kind}</td><td>${n.hops}</td></tr>
  `).join('');
  document.getElementById('net-content').innerHTML = `
    <div><b>Stats:</b> ${map.stats.node_count} nodes, ${map.stats.path_count} paths,
      ${map.stats.interface_count} interfaces</div>
    <h4 style="margin:10px 0 4px;">Interfaces</h4>
    <table style="width:100%; border-collapse:collapse;">
      <tr style="color:var(--dim); text-align:left;">
        <th>Name</th><th>Type</th><th>Enabled</th><th>Status</th><th>Rx</th><th>Tx</th>
      </tr>
      ${ifaceRows || '<tr><td colspan="6">none configured</td></tr>'}
    </table>
    <h4 style="margin:10px 0 4px;">Nodes</h4>
    <table style="width:100%; border-collapse:collapse;">
      <tr style="color:var(--dim); text-align:left;"><th>Label</th><th>Kind</th><th>Hops</th></tr>
      ${nodeRows || '<tr><td colspan="3">none</td></tr>'}
    </table>
  `;
}

async function resetEnvironment() {
  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';
  closeMembersModal();
  closePermissionsModal();
  TESTERS.forEach(tag => {
    if (state[tag] && state[tag].ws) state[tag].ws.close();
  });
  closeEmojiPicker();
  closeNetworkModal();
  try {
    const res = await fetch('/reset', {method: 'POST'});
    const body = await res.json();
    if (!body.ok) toast('Reset had trouble bringing all testers back up');
  } catch (e) {
    toast('Reset request failed: ' + e);
  }
  await init();
  btn.disabled = false;
  btn.textContent = 'Reset environment';
}

async function init() {
  const cfg = await (await fetch('/config')).json();
  API_TOKEN = cfg.api_token || '';
  TESTERS = cfg.testers.map(t => t.tag);
  LINK_PROFILES = cfg.link_profiles || [];
  state = {};
  avatarCache = {};
  emojiLibrary = {};
  hashToTag = {};
  cfg.testers.forEach(t => {
    state[t.tag] = blankState(t.api_port);
    state[t.tag].linkProfile = t.link_profile || 'broadband';
    avatarCache[t.tag] = {};
    emojiLibrary[t.tag] = [];
  });
  document.getElementById('panes').style.setProperty('--cols', colsFor(TESTERS.length));
  renderShell();
  await Promise.all(TESTERS.map(connectTester));
  refreshTesterStatus();
  if (!presencePollStarted) {
    presencePollStarted = true;
    setInterval(refreshTesterStatus, 5000);
  }
}

let presencePollStarted = false;

init();
</script>
