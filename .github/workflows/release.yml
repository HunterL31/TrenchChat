name: Build & Release

# PR branches and push to main: tests only. Building and releasing never
# happen automatically — they are opt-in via manual workflow_dispatch.
# workflow_dispatch from main: bump version (tag only — no commit back),
# build, and publish a GitHub Release.
# workflow_dispatch from any other branch: dry run — tests + installer
# builds with version 0.0.0, uploaded as workflow artifacts; no tag, no
# release.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # test — run the full test suite before building anything.
  # ---------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Qt and voice system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libxcb-cursor0 \
            libxcb1 \
            libx11-6 \
            libgl1 \
            libopus0 \
            libportaudio2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # bump_version — compute the next semver from git tags.
  #
  # Only runs when manually triggered (workflow_dispatch) from main:
  #   - Creates and pushes a vX.Y.Z tag. The tag is the sole source of truth
  #     for the version — nothing is committed back to pyproject.toml.
  #
  # Versioning rules:
  #   - Previous version is read from the latest vX.Y.Z git tag.
  #   - If any commit since that tag contains "[major]", bump major.
  #   - If any commit contains "[patch]", bump patch only.
  #   - Otherwise bump minor and reset patch to 0.
  # ---------------------------------------------------------------------------
  bump_version:
    name: Bump version & collect changelog
    runs-on: ubuntu-22.04
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.bump.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute version and collect changelog
        id: bump
        run: |
          # --- Find the most recent vX.Y.Z tag ---
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_VERSION=$(python3 -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
            PREV_TAG=""
          else
            PREV_VERSION="${PREV_TAG#v}"
          fi

          echo "Previous version: ${PREV_VERSION}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # --- Collect commits since the last tag ---
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # --- Decide bump type ---
          # Commit keyword rules (case-insensitive, checked in priority order):
          #   [major]  → bump major, reset minor and patch to 0
          #   [patch]  → bump patch only
          #   (none)   → bump minor, reset patch to 0
          if echo "$COMMITS" | grep -qi '\[major\]'; then
            NEW_MAJOR=$((MAJOR + 1)); NEW_MINOR=0; NEW_PATCH=0
          elif echo "$COMMITS" | grep -qi '\[patch\]'; then
            NEW_MAJOR=$MAJOR; NEW_MINOR=$MINOR; NEW_PATCH=$((PATCH + 1))
          else
            NEW_MAJOR=$MAJOR; NEW_MINOR=$((MINOR + 1)); NEW_PATCH=0
          fi

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "Release: ${NEW_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          if [ -z "$COMMITS" ]; then
            COMMITS="- No user-facing changes"
          fi

          # A commit subject is attacker-controlled text, and a fixed
          # delimiter appearing in one ends the block early -- after which the
          # rest of that subject sets step outputs of its own, including the
          # tag the build job checks out. A random one cannot be guessed by
          # someone writing the commit.
          DELIM="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "new_version=${NEW_VERSION}"
            echo "tag=${NEW_TAG}"
            echo "changelog<<${DELIM}"
            echo "$COMMITS"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # build — matrix across Windows / Ubuntu / macOS.
  #
  # Each leg builds the Flutter client (web + this platform's desktop bundle),
  # freezes the backend with PyInstaller, stages the desktop bundle into the
  # frozen output, then wraps it in the platform installer. Runs only on
  # workflow_dispatch: real version from bump_version when dispatched from
  # main, otherwise a 0.0.0 dry run.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: [test, bump_version]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.bump_version.result == 'success' || github.event_name == 'workflow_dispatch')
    env:
      APP_VERSION: ${{ needs.bump_version.outputs.new_version || '0.0.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TrenchChat-Setup
            artifact_ext: .exe
          - os: ubuntu-22.04
            artifact_name: trenchchat
            artifact_ext: .deb
          - os: macos-latest
            artifact_name: TrenchChat
            artifact_ext: -macos.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Flutter
        # Pinned to a commit: a tag can be moved by its owner, and this
        # runs in a job that can write to this repository.
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba  # v2.9.1
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libopus0 libportaudio2

      - name: Build Flutter client (web + desktop)
        shell: bash
        working-directory: flutter_ui
        run: |
          flutter build web --release
          case "$RUNNER_OS" in
            Windows) flutter build windows --release ;;
            Linux)   flutter build linux --release ;;
            macOS)   flutter build macos --release ;;
          esac

      - name: Stage libopus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows
          New-Item -ItemType Directory -Force packaging\voicelibs | Out-Null
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\opus.dll" `
            packaging\voicelibs\opus.dll

      - name: Stage libopus (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opus
          mkdir -p packaging/voicelibs
          cp "$(brew --prefix opus)/lib/libopus.dylib" packaging/voicelibs/libopus.dylib

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install -r requirements.txt -r devtools/testenv/requirements.txt \
            "pyinstaller>=6.0"

      - name: Freeze application (PyInstaller)
        run: pyinstaller trenchchat.spec

      - name: Stage Flutter desktop client into the frozen app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              cp -r flutter_ui/build/windows/x64/runner/Release \
                dist/TrenchChat/_internal/flutter_client
              ;;
            Linux)
              cp -r flutter_ui/build/linux/x64/release/bundle \
                dist/TrenchChat/_internal/flutter_client
              ;;
            macOS)
              ditto flutter_ui/build/macos/Build/Products/Release/flutter_ui.app \
                "dist/TrenchChat.app/Contents/Frameworks/flutter_client/flutter_ui.app"
              ;;
          esac

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="$version" packaging\windows\trenchchat.iss
          $exe = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "dist\TrenchChat-Setup-${version}.exe" }

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "$APP_VERSION"

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh "$APP_VERSION"

      - name: Locate built artifact
        id: find_artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARTIFACT=$(find dist -name "TrenchChat-Setup-*.exe" | head -1)
          elif [ "$RUNNER_OS" = "Linux" ]; then
            ARTIFACT=$(find dist -name "trenchchat-*.deb" | head -1)
          else
            ARTIFACT=$(find dist -name "TrenchChat-*-macos.dmg" | head -1)
          fi
          echo "path=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Artifact: ${ARTIFACT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ steps.find_artifact.outputs.path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # release — publish a GitHub Release from the three built installers.
  # Only runs when bump_version actually ran (workflow_dispatch from main);
  # workflow_dispatch dry runs from other branches stop at the uploaded
  # artifacts.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [bump_version, build]
    if: needs.bump_version.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        # Pinned to a commit for the same reason as flutter-action above.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.bump_version.outputs.tag }}
          name: "TrenchChat ${{ needs.bump_version.outputs.new_version }}"
          body: |
            ## TrenchChat ${{ needs.bump_version.outputs.new_version }}

            ### What's in this release

            ${{ needs.bump_version.outputs.changelog }}

            ---

            ### Installation

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `TrenchChat-Setup-*.exe` | Run the installer; upgrades existing installs in-place |
            | Ubuntu/Debian | `trenchchat-*.deb` | `sudo dpkg -i trenchchat-*.deb` |
            | macOS | `TrenchChat-*-macos.dmg` | Open and drag TrenchChat.app to Applications |

            ### User data

            Your identity, channels, and message history in `~/.trenchchat/` are
            preserved across upgrades on all platforms.

            > **Note:** Binaries are not code-signed. Windows will show a SmartScreen
            > warning; macOS will show an "unidentified developer" dialog. You can
            > bypass these in your OS security settings.
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
